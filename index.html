<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dino Surfers - Zoo Run</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #4ec0e8;
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: #fff;
    touch-action: none;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(20, 40, 30, 0.92);
    z-index: 10; padding: 20px; text-align: center;
  }
  .overlay h1 {
    font-size: clamp(2rem, 8vw, 4.2rem);
    margin: 0 0 6px;
    color: #ffe44f;
    text-shadow: 3px 3px 0 #c2410c, 6px 6px 0 rgba(0,0,0,0.3);
    letter-spacing: 2px;
  }
  .overlay h2 {
    font-size: 1.1rem; color: #a7f3d0; margin-bottom: 14px;
  }
  .overlay p {
    font-size: 0.95rem; max-width: 460px; line-height: 1.45; margin: 6px 0 18px;
    color: #d1f5e6;
  }
  .dino-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 12px; max-width: 500px; width: 100%; margin: 10px 0 18px;
  }
  .dino-card {
    background: linear-gradient(160deg, #15803d, #064e3b);
    border: 3px solid #fff;
    border-radius: 16px;
    padding: 10px 8px;
    cursor: pointer;
    transition: transform 0.15s;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.3);
  }
  .dino-card:hover, .dino-card.selected {
    transform: translateY(-4px) scale(1.05);
    border-color: #fde047;
  }
  .dino-card canvas { width: 84px; height: 84px; }
  .dino-card .name { font-weight: bold; font-size: 0.95rem; margin-top: 4px; }
  .dino-card .desc { font-size: 0.7rem; opacity: 0.9; margin-top: 2px; }
  button.play {
    background: linear-gradient(180deg, #fde047, #f59e0b);
    color: #14532d;
    font-weight: 900; font-size: 1.3rem;
    border: 3px solid #fff;
    padding: 14px 40px; border-radius: 14px;
    cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
  }
  button.play:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.3); }
  .hud {
    position: fixed; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between;
    pointer-events: none; z-index: 5;
    font-weight: bold; text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }
  .hud .stat {
    background: rgba(20, 40, 30, 0.6);
    padding: 6px 14px;
    border-radius: 10px;
    border: 2px solid #fde047;
    font-size: 1rem;
  }
  .hidden { display: none !important; }
  .controls-hint {
    position: fixed; bottom: 10px; left: 0; right: 0;
    text-align: center; font-size: 0.8rem;
    opacity: 0.6; pointer-events: none; z-index: 5;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
  }
  .touch-zone {
    position: fixed; inset: 0; z-index: 4;
    touch-action: none;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
  <div class="stat" id="scoreStat">🏃 0m</div>
  <div class="stat" id="boneStat">🦴 0</div>
  <div class="stat" id="bestStat">⭐ 0m</div>
</div>

<div class="touch-zone hidden" id="touchZone"></div>

<div class="controls-hint hidden" id="hint">
  A/D oder ← → Spur · W/↑/Leertaste = springen · S/↓ = rutschen · (Mobil: wischen)
</div>

<div class="overlay" id="menu">
  <h1>🦖 Dino Surfers 🦕</h1>
  <h2>ZOO RUN</h2>
  <p>Renne durch den Zoo, weiche Käfigen aus, springe über Wassertröge, rutsche unter Stangen und sammle Knochen! Wische oder nutze WASD/Pfeiltasten.</p>
  <div class="dino-grid" id="dinoGrid"></div>
  <button class="play" id="btnPlay">LOS GEHT'S</button>
</div>

<div class="overlay hidden" id="endScreen">
  <h1 id="endTitle">Game Over</h1>
  <p id="endText"></p>
  <button class="play" id="btnRestart">NOCHMAL</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.width = innerWidth * dpr;
    H = canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  addEventListener('resize', resize);
  resize();

  // ====== Dino definitions ======
  const DINOS = [
    { id: 'rex',    name: 'Rex',     body: '#22c55e', belly: '#bbf7d0', spike: '#15803d', desc: 'T-Rex' },
    { id: 'tri',    name: 'Trixi',   body: '#a855f7', belly: '#e9d5ff', spike: '#6b21a8', desc: 'Tri' },
    { id: 'ptero',  name: 'Pteri',   body: '#3b82f6', belly: '#bfdbfe', spike: '#1e3a8a', desc: 'Flug' },
    { id: 'bronto', name: 'Bronto',  body: '#f97316', belly: '#fed7aa', spike: '#7c2d12', desc: 'Lang' },
  ];
  let selectedDinoId = 'rex';

  // ====== Draw a dino (top-down/side cartoon) ======
  function drawDino(ctx, x, y, scale, dino, pose = 'run', tick = 0) {
    // pose: 'run', 'jump', 'slide'
    const s = scale;
    ctx.save();
    ctx.translate(x, y);

    // Shadow
    if (pose !== 'jump') {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 32 * s, 30 * s, 6 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (pose === 'slide') {
      ctx.translate(0, 14 * s);
      ctx.rotate(-0.15);
    }

    // Tail
    ctx.fillStyle = dino.body;
    ctx.beginPath();
    ctx.moveTo(-28 * s, 0);
    ctx.quadraticCurveTo(-50 * s, -5 * s + Math.sin(tick * 0.3) * 4 * s, -55 * s, 0);
    ctx.quadraticCurveTo(-45 * s, 8 * s, -28 * s, 12 * s);
    ctx.closePath();
    ctx.fill();

    // Body
    ctx.fillStyle = dino.body;
    ctx.beginPath();
    ctx.ellipse(0, 5 * s, 30 * s, 22 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Belly
    ctx.fillStyle = dino.belly;
    ctx.beginPath();
    ctx.ellipse(2 * s, 12 * s, 22 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Spikes on back
    ctx.fillStyle = dino.spike;
    for (let i = 0; i < 4; i++) {
      const sx = -18 * s + i * 12 * s;
      ctx.beginPath();
      ctx.moveTo(sx, -10 * s);
      ctx.lineTo(sx + 4 * s, -18 * s);
      ctx.lineTo(sx + 8 * s, -10 * s);
      ctx.closePath();
      ctx.fill();
    }

    // Legs (running animation)
    const legSwing = Math.sin(tick * 0.5) * 6 * s;
    ctx.fillStyle = dino.body;
    if (pose === 'run') {
      ctx.fillRect(-10 * s, 22 * s, 8 * s, 14 * s + legSwing);
      ctx.fillRect(8 * s, 22 * s, 8 * s, 14 * s - legSwing);
    } else if (pose === 'jump') {
      ctx.fillRect(-10 * s, 18 * s, 8 * s, 10 * s);
      ctx.fillRect(8 * s, 18 * s, 8 * s, 10 * s);
    } else {
      ctx.fillRect(-12 * s, 22 * s, 22 * s, 8 * s);
    }

    // Arms
    ctx.fillStyle = dino.body;
    ctx.beginPath();
    ctx.ellipse(18 * s, 8 * s, 6 * s, 10 * s, 0.3, 0, Math.PI * 2);
    ctx.fill();

    // Head
    ctx.fillStyle = dino.body;
    ctx.beginPath();
    ctx.ellipse(30 * s, -10 * s, 22 * s, 18 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // Snout
    ctx.beginPath();
    ctx.ellipse(46 * s, -6 * s, 12 * s, 10 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(33 * s, -14 * s, 5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(35 * s, -14 * s, 2.5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(36 * s, -15 * s, 1 * s, 0, Math.PI * 2);
    ctx.fill();

    // Nostril
    ctx.fillStyle = dino.spike;
    ctx.beginPath();
    ctx.arc(52 * s, -8 * s, 1.2 * s, 0, Math.PI * 2);
    ctx.fill();

    // Teeth
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(40 * s, 0);
    ctx.lineTo(42 * s, 4 * s);
    ctx.lineTo(44 * s, 0);
    ctx.lineTo(46 * s, 4 * s);
    ctx.lineTo(48 * s, 0);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // ====== Dino selection cards ======
  const grid = document.getElementById('dinoGrid');
  DINOS.forEach(d => {
    const card = document.createElement('div');
    card.className = 'dino-card' + (d.id === selectedDinoId ? ' selected' : '');
    const cv = document.createElement('canvas');
    cv.width = 168; cv.height = 168;
    const c = cv.getContext('2d');
    drawDino(c, 70, 95, 1.3, d, 'run', 0);
    card.appendChild(cv);
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = d.name; card.appendChild(nm);
    const ds = document.createElement('div'); ds.className = 'desc'; ds.textContent = d.desc; card.appendChild(ds);
    card.addEventListener('click', () => {
      selectedDinoId = d.id;
      [...grid.children].forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    });
    grid.appendChild(card);
  });

  // ====== Game state ======
  let game = null;
  const LANES = [-1, 0, 1]; // left, center, right
  const LANE_W = 1.3;
  const HORIZON = 0.45; // fraction of H
  const FAR_Z = 100;

  function bestKey() { return 'dinoSurfers_best'; }
  function getBest() { return parseInt(localStorage.getItem(bestKey()) || '0', 10); }
  function setBest(v) { localStorage.setItem(bestKey(), v); }

  function createGame() {
    return {
      dino: DINOS.find(d => d.id === selectedDinoId),
      lane: 1,           // index in LANES
      laneAnim: 0,       // current x in lane units (smoothed)
      laneTarget: 0,
      vy: 0,
      y: 0,              // height above ground
      jumping: false,
      sliding: 0,        // ms remaining
      obstacles: [],
      bones: [],
      decor: [],         // background zoo decor
      speed: 0.55,
      distance: 0,
      bones_count: 0,
      tick: 0,
      spawnTimer: 0,
      decorTimer: 0,
      over: false,
      hitFlash: 0,
    };
  }

  // ====== Projection (perspective: path narrows toward top horizon) ======
  // z=0 = player position (bottom-near). z=FAR_Z = horizon at top of screen.
  function project(worldX, worldY, z) {
    const playerScreenY = H * 0.82;
    const horizonY = H * 0.12;
    const k = 0.05;
    const scale = 1 / (1 + Math.max(0, z) * k);
    const screenY = horizonY + (playerScreenY - horizonY) * scale;
    const cx = W / 2;
    const screenX = cx + worldX * (W * 0.2) * scale;
    return { x: screenX, y: screenY - worldY * H * 0.2 * scale, scale };
  }

  // ====== Obstacle types (zoo themed) ======
  const OBSTACLE_TYPES = [
    { id: 'cage',    type: 'block',  w: 0.9, h: 1.0, color: '#6b7280', accent: '#374151' }, // cage - must change lane
    { id: 'trough',  type: 'jump',   w: 0.9, h: 0.35, color: '#3b82f6', accent: '#1e40af' }, // water trough - jump
    { id: 'gate',    type: 'slide',  w: 1.1, h: 0.4, gap: 0.55, color: '#a16207', accent: '#78350f' }, // overhead bar - slide
    { id: 'haystack',type: 'jump',   w: 0.9, h: 0.5, color: '#facc15', accent: '#a16207' },
    { id: 'statue',  type: 'block',  w: 0.7, h: 1.1, color: '#d6d3d1', accent: '#78716c' },
  ];

  function spawnObstacle() {
    const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
    // Sometimes occupy 1-2 lanes
    const wide = Math.random() < 0.15 && type.type === 'slide';
    const lane = Math.floor(Math.random() * 3);
    game.obstacles.push({
      lane, type, z: FAR_Z, wide,
      y: 0,
    });
  }
  function spawnBonesRow() {
    const lane = Math.floor(Math.random() * 3);
    const count = 3 + Math.floor(Math.random() * 4);
    const above = Math.random() < 0.25; // bone above (need jump)
    for (let i = 0; i < count; i++) {
      game.bones.push({ lane, z: FAR_Z + i * 5, y: above ? 0.6 : 0.15, collected: false });
    }
  }
  function spawnDecor() {
    // Trees, signs, animal enclosures on the sides
    const side = Math.random() < 0.5 ? -1 : 1;
    const kind = Math.floor(Math.random() * 4);
    game.decor.push({ side, x: side * (2.2 + Math.random() * 1.2), z: FAR_Z, kind });
  }

  // ====== Input ======
  const keys = {};
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') moveLane(-1);
    if (k === 'd' || k === 'arrowright') moveLane(1);
    if (k === 'w' || k === 'arrowup' || k === ' ') jump();
    if (k === 's' || k === 'arrowdown') slide();
    keys[k] = true;
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // Touch / swipe
  let touchStart = null;
  const touchZone = document.getElementById('touchZone');
  touchZone.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY, time: performance.now() };
    e.preventDefault();
  }, { passive: false });
  touchZone.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const dt = performance.now() - touchStart.time;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (Math.max(adx, ady) < 25 && dt < 250) {
      jump(); // tap = jump
    } else if (adx > ady) {
      if (dx > 0) moveLane(1); else moveLane(-1);
    } else {
      if (dy < 0) jump(); else slide();
    }
    touchStart = null;
    e.preventDefault();
  }, { passive: false });

  function moveLane(dir) {
    if (!game || game.over) return;
    game.lane = Math.max(0, Math.min(2, game.lane + dir));
  }
  function jump() {
    if (!game || game.over) return;
    if (!game.jumping && game.y === 0) {
      game.vy = 0.32;
      game.jumping = true;
      game.sliding = 0;
    }
  }
  function slide() {
    if (!game || game.over) return;
    if (game.y === 0) {
      game.sliding = 600;
    } else {
      game.vy = -0.25; // fast fall
    }
  }

  // ====== Update ======
  function update(dt) {
    if (game.over) return;
    game.tick += dt * 0.06;
    const dts = dt / 16.67; // normalized to 60fps

    // Speed ramp
    game.speed = Math.min(1.2, 0.55 + game.distance / 2200);

    // Distance
    game.distance += game.speed * dts * 2;

    // Lane interpolation
    const targetX = LANES[game.lane] * LANE_W;
    game.laneAnim += (targetX - game.laneAnim) * 0.2 * dts;

    // Jump physics
    if (game.jumping || game.y > 0) {
      game.y += game.vy * dts;
      game.vy -= 0.022 * dts;
      if (game.y <= 0) {
        game.y = 0; game.vy = 0; game.jumping = false;
      }
    }
    // Sliding
    if (game.sliding > 0) {
      game.sliding -= dt;
      if (game.sliding < 0) game.sliding = 0;
    }

    // Move world toward player
    const moveZ = game.speed * dts;
    for (const o of game.obstacles) o.z -= moveZ;
    for (const b of game.bones) b.z -= moveZ;
    for (const d of game.decor) d.z -= moveZ;

    // Cull
    game.obstacles = game.obstacles.filter(o => o.z > -3);
    game.bones = game.bones.filter(b => b.z > -3 && !b.collected);
    game.decor = game.decor.filter(d => d.z > -3);

    // Spawn
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      const r = Math.random();
      if (r < 0.65) spawnObstacle();
      else spawnBonesRow();
      game.spawnTimer = 700 + Math.random() * 600 - game.speed * 200;
    }
    game.decorTimer -= dt;
    if (game.decorTimer <= 0) {
      spawnDecor();
      game.decorTimer = 200 + Math.random() * 300;
    }

    // Collision
    const playerLaneX = game.laneAnim;
    const playerHeight = game.sliding > 0 ? 0.3 : 1.0;
    const playerY = game.y;
    for (const o of game.obstacles) {
      if (Math.abs(o.z) < 0.8) {
        const oLaneX = LANES[o.lane] * LANE_W;
        const dx = Math.abs(playerLaneX - oLaneX);
        if (dx < o.type.w * 0.5 + 0.35 || (o.wide && true)) {
          // Vertical check
          if (o.type.type === 'jump') {
            if (playerY < o.type.h) collide();
          } else if (o.type.type === 'slide') {
            // pole at height = gap...gap+h
            if (playerY + playerHeight > o.type.gap) collide();
          } else { // block
            if (playerY < o.type.h) collide();
          }
        }
      }
    }
    for (const b of game.bones) {
      if (Math.abs(b.z) < 0.6) {
        const oLaneX = LANES[b.lane] * LANE_W;
        const dx = Math.abs(playerLaneX - oLaneX);
        if (dx < 0.5) {
          const dy = Math.abs(playerY - b.y);
          if (dy < 0.5) {
            b.collected = true;
            game.bones_count++;
          }
        }
      }
    }

    if (game.hitFlash > 0) game.hitFlash -= dt;

    // HUD
    document.getElementById('scoreStat').textContent = `🏃 ${Math.floor(game.distance)}m`;
    document.getElementById('boneStat').textContent = `🦴 ${game.bones_count}`;
    document.getElementById('bestStat').textContent = `⭐ ${getBest()}m`;
  }

  function collide() {
    if (game.hitFlash > 0) return;
    endGame();
  }

  function endGame() {
    game.over = true;
    const score = Math.floor(game.distance);
    if (score > getBest()) setBest(score);
    document.getElementById('endTitle').textContent = '💥 Erwischt!';
    document.getElementById('endText').textContent = `Strecke: ${score}m · Knochen: ${game.bones_count} · Bester: ${getBest()}m`;
    document.getElementById('endScreen').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('hint').classList.add('hidden');
    document.getElementById('touchZone').classList.add('hidden');
  }

  // ====== Render ======
  function drawSky() {
    const horizonY = H * 0.12;
    // Sky gradient
    const sg = ctx.createLinearGradient(0, 0, 0, horizonY);
    sg.addColorStop(0, '#7dd3fc');
    sg.addColorStop(1, '#fde68a');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, horizonY);
    // Sun
    ctx.fillStyle = '#fef3c7';
    ctx.beginPath();
    ctx.arc(W * 0.78, H * 0.05, H * 0.04, 0, Math.PI * 2);
    ctx.fill();
    // Distant tree silhouette along horizon
    ctx.fillStyle = '#15803d';
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    let x = 0;
    while (x <= W) {
      const h = 14 + Math.sin(x * 0.013 + 1.3) * 8 + Math.sin(x * 0.007 + 5) * 10;
      ctx.lineTo(x, horizonY - h);
      x += 24;
    }
    ctx.lineTo(W, horizonY);
    ctx.closePath();
    ctx.fill();
    // Grass under horizon (entire ground area)
    const gg = ctx.createLinearGradient(0, horizonY, 0, H);
    gg.addColorStop(0, '#22c55e');
    gg.addColorStop(1, '#15803d');
    ctx.fillStyle = gg;
    ctx.fillRect(0, horizonY, W, H - horizonY);
  }

  function drawGround() {
    // Path: vertical strip with mild width fade at top (depth hint)
    const farL = project(-LANE_W * 1.7, 0, FAR_Z);
    const farR = project(LANE_W * 1.7, 0, FAR_Z);
    const nearL = project(-LANE_W * 1.7, 0, 0);
    const nearR = project(LANE_W * 1.7, 0, 0);

    // Sandy path
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#a39368');
    grad.addColorStop(1, '#e0d29f');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(farL.x, farL.y);
    ctx.lineTo(farR.x, farR.y);
    ctx.lineTo(nearR.x, nearR.y);
    ctx.lineTo(nearL.x, nearL.y);
    ctx.closePath();
    ctx.fill();

    // Path borders
    ctx.strokeStyle = '#854d0e';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(farL.x, farL.y); ctx.lineTo(nearL.x, nearL.y);
    ctx.moveTo(farR.x, farR.y); ctx.lineTo(nearR.x, nearR.y);
    ctx.stroke();

    // Lane dividers (vertical lines)
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 3;
    ctx.setLineDash([18, 22]);
    const offset = (game.distance * 22) % 40;
    ctx.lineDashOffset = -offset;
    for (let i = -1; i <= 1; i += 2) {
      const fL = project(i * LANE_W * 0.5, 0, FAR_Z);
      const nL = project(i * LANE_W * 0.5, 0, 0);
      ctx.beginPath();
      ctx.moveTo(fL.x, fL.y);
      ctx.lineTo(nL.x, nL.y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;

    // Paw print decals scrolling down the receding path
    ctx.fillStyle = 'rgba(120, 70, 30, 0.3)';
    const pawSpacing = 4.5;
    const pawScroll = game.distance % pawSpacing;
    for (let pz = -pawScroll; pz < FAR_Z; pz += pawSpacing) {
      if (pz < 0.1) continue;
      const p = project(0, 0, pz);
      const s = p.scale;
      if (s < 0.1) continue;
      for (const lane of LANES) {
        const px = project(lane * LANE_W * 0.55, 0, pz).x;
        ctx.beginPath();
        ctx.arc(px - 8 * s, p.y, 4 * s, 0, Math.PI * 2);
        ctx.arc(px + 8 * s, p.y, 4 * s, 0, Math.PI * 2);
        ctx.arc(px - 5 * s, p.y - 10 * s, 3 * s, 0, Math.PI * 2);
        ctx.arc(px + 5 * s, p.y - 10 * s, 3 * s, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Zoo entrance arch at horizon (the path comes from here)
    const horizonY = H * 0.12;
    const archP = project(0, 0, FAR_Z * 0.95);
    const archW = Math.abs(project(LANE_W * 1.5, 0, FAR_Z * 0.95).x - archP.x);
    const archH = archW * 0.55;
    ctx.fillStyle = '#a16207';
    ctx.fillRect(archP.x - archW - 4, archP.y - archH, 8, archH);
    ctx.fillRect(archP.x + archW - 4, archP.y - archH, 8, archH);
    ctx.fillRect(archP.x - archW - 4, archP.y - archH - 6, archW * 2 + 8, 8);
    ctx.fillStyle = '#dc2626';
    ctx.font = `bold ${Math.max(8, archH * 0.4)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('ZOO', archP.x, archP.y - archH - 2);
  }

  function drawDecor(d) {
    const p = project(d.x, 0, d.z);
    const s = p.scale;
    if (s <= 0.01) return;
    if (d.kind === 0) {
      // Palm / tree
      ctx.fillStyle = '#78350f';
      ctx.fillRect(p.x - 4 * s, p.y - 80 * s, 8 * s, 80 * s);
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.arc(p.x, p.y - 85 * s, 30 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.arc(p.x - 10 * s, p.y - 95 * s, 20 * s, 0, Math.PI * 2);
      ctx.arc(p.x + 12 * s, p.y - 92 * s, 22 * s, 0, Math.PI * 2);
      ctx.fill();
    } else if (d.kind === 1) {
      // Sign (zoo direction)
      ctx.fillStyle = '#78350f';
      ctx.fillRect(p.x - 3 * s, p.y - 60 * s, 6 * s, 60 * s);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(p.x - 30 * s, p.y - 60 * s, 60 * s, 24 * s);
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = 2 * s;
      ctx.strokeRect(p.x - 30 * s, p.y - 60 * s, 60 * s, 24 * s);
      ctx.fillStyle = '#7c2d12';
      ctx.font = `bold ${Math.max(6, 14 * s)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🦁', p.x, p.y - 48 * s);
    } else if (d.kind === 2) {
      // Animal enclosure fence
      ctx.fillStyle = '#a16207';
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(p.x - 25 * s + i * 12 * s, p.y - 35 * s, 4 * s, 35 * s);
      }
      ctx.fillRect(p.x - 25 * s, p.y - 28 * s, 60 * s, 4 * s);
      ctx.fillRect(p.x - 25 * s, p.y - 12 * s, 60 * s, 4 * s);
      // A peeking animal
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.arc(p.x, p.y - 22 * s, 10 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(p.x - 3 * s, p.y - 24 * s, 1.5 * s, 0, Math.PI * 2);
      ctx.arc(p.x + 3 * s, p.y - 24 * s, 1.5 * s, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Bush
      ctx.fillStyle = '#166534';
      ctx.beginPath();
      ctx.arc(p.x - 8 * s, p.y - 8 * s, 14 * s, 0, Math.PI * 2);
      ctx.arc(p.x + 8 * s, p.y - 10 * s, 16 * s, 0, Math.PI * 2);
      ctx.arc(p.x, p.y - 14 * s, 16 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawObstacle(o) {
    const oLaneX = LANES[o.lane] * LANE_W;
    const p = project(oLaneX, 0, o.z);
    const s = p.scale;
    if (s <= 0.01) return;
    const t = o.type;
    // Soft shadow under each obstacle (top-down sense of mass)
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(p.x + 4*s, p.y + 6*s, 50*s, 14*s, 0, 0, Math.PI*2);
    ctx.fill();

    if (t.id === 'cage') {
      const w = 90 * s, h = 90 * s;
      ctx.fillStyle = '#9ca3af';
      ctx.fillRect(p.x - w/2, p.y - h/2, w, h);
      ctx.strokeStyle = '#374151';
      ctx.lineWidth = Math.max(1, 3 * s);
      for (let i = 0; i < 5; i++) {
        const bx = p.x - w/2 + (i+0.5) * w/5;
        ctx.beginPath();
        ctx.moveTo(bx, p.y - h/2 + 6*s); ctx.lineTo(bx, p.y + h/2 - 6*s);
        ctx.stroke();
      }
      ctx.strokeRect(p.x - w/2, p.y - h/2, w, h);
      // Red roof corners (top-down)
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(p.x - w/2 - 4*s, p.y - h/2 - 4*s, w + 8*s, 8*s);
      // Caged animal peeking
      ctx.fillStyle = '#fef3c7';
      ctx.beginPath();
      ctx.arc(p.x - 8*s, p.y, 4*s, 0, Math.PI*2);
      ctx.arc(p.x + 8*s, p.y, 4*s, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(p.x - 8*s, p.y, 2*s, 0, Math.PI*2);
      ctx.arc(p.x + 8*s, p.y, 2*s, 0, Math.PI*2);
      ctx.fill();
    } else if (t.id === 'trough') {
      const w = 100 * s, h = 36 * s;
      ctx.fillStyle = '#78350f';
      ctx.fillRect(p.x - w/2, p.y - h/2, w, h);
      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(p.x - w/2 + 4*s, p.y - h/2 + 4*s, w - 8*s, h - 8*s);
      ctx.strokeStyle = '#bfdbfe';
      ctx.lineWidth = Math.max(1, 2*s);
      ctx.beginPath();
      for (let i = 0; i < w - 8*s; i += 8*s) {
        const wy = p.y + Math.sin((i + game.tick*4) * 0.1) * 2*s;
        const wx = p.x - w/2 + 4*s + i;
        if (i === 0) ctx.moveTo(wx, wy);
        else ctx.lineTo(wx, wy);
      }
      ctx.stroke();
    } else if (t.id === 'gate') {
      // Bar across the lane (slide under it)
      const w = 120 * s, h = 22 * s;
      // Posts on either side
      ctx.fillStyle = '#78350f';
      ctx.fillRect(p.x - w/2 - 8*s, p.y - h/2 - 6*s, 10*s, h + 12*s);
      ctx.fillRect(p.x + w/2 - 2*s, p.y - h/2 - 6*s, 10*s, h + 12*s);
      // Bar with stripes
      ctx.fillStyle = '#a16207';
      ctx.fillRect(p.x - w/2, p.y - h/2, w, h);
      ctx.fillStyle = '#fbbf24';
      for (let i = 0; i < 6; i++) {
        ctx.fillRect(p.x - w/2 + (i * w/6) + 4*s, p.y - h/2, w/18, h);
      }
      ctx.font = `bold ${Math.max(10, 18*s)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐘', p.x, p.y);
    } else if (t.id === 'haystack') {
      const r = 42 * s;
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#a16207';
      ctx.lineWidth = Math.max(1, 1.5*s);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(a) * r * 0.4, p.y + Math.sin(a) * r * 0.4);
        ctx.lineTo(p.x + Math.cos(a) * r * 0.95, p.y + Math.sin(a) * r * 0.95);
        ctx.stroke();
      }
    } else if (t.id === 'statue') {
      // Elephant-ish statue, top-down view
      const r = 36 * s;
      ctx.fillStyle = '#d6d3d1';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 6*s, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#a8a29e';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, r, r * 0.85, 0, 0, Math.PI*2);
      ctx.fill();
      // Trunk (line out the front, toward player = down)
      ctx.fillStyle = '#78716c';
      ctx.fillRect(p.x - 5*s, p.y + r * 0.6, 10*s, r * 0.7);
      // Ears
      ctx.fillStyle = '#a8a29e';
      ctx.beginPath();
      ctx.arc(p.x - r * 0.8, p.y - r * 0.3, r * 0.4, 0, Math.PI*2);
      ctx.arc(p.x + r * 0.8, p.y - r * 0.3, r * 0.4, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawBone(b) {
    const oLaneX = LANES[b.lane] * LANE_W;
    const p = project(oLaneX, b.y, b.z);
    const s = p.scale;
    if (s <= 0.01) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(game.tick * 0.1 + b.z * 0.2);
    ctx.fillStyle = '#fef3c7';
    ctx.strokeStyle = '#a16207';
    ctx.lineWidth = Math.max(1, 1.5 * s);
    // Bone shape
    const len = 20 * s;
    ctx.beginPath();
    ctx.ellipse(-len, 0, 6*s, 6*s, 0, 0, Math.PI*2);
    ctx.ellipse(-len, -6*s, 5*s, 5*s, 0, 0, Math.PI*2);
    ctx.ellipse(-len, 6*s, 5*s, 5*s, 0, 0, Math.PI*2);
    ctx.ellipse(len, 0, 6*s, 6*s, 0, 0, Math.PI*2);
    ctx.ellipse(len, -6*s, 5*s, 5*s, 0, 0, Math.PI*2);
    ctx.ellipse(len, 6*s, 5*s, 5*s, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fef3c7';
    ctx.fillRect(-len, -5*s, len * 2, 10*s);
    ctx.strokeRect(-len, -5*s, len * 2, 10*s);
    ctx.restore();
  }

  // Top-down dino (head up the screen, into the world)
  function drawDinoTopDown(ctx, x, y, scale, dino, pose, tick, jumpAmt) {
    const s = scale;
    ctx.save();
    ctx.translate(x, y);

    // Detached shadow when jumping
    const shadowDrop = jumpAmt * 28;
    ctx.fillStyle = `rgba(0,0,0,${0.35 - jumpAmt * 0.15})`;
    ctx.beginPath();
    ctx.ellipse(0, 28 * s + shadowDrop, 28 * s, 9 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Tail behind (toward bottom of screen)
    const tailSway = Math.sin(tick * 0.35) * 5 * s;
    ctx.fillStyle = dino.body;
    ctx.beginPath();
    ctx.moveTo(-9 * s, 14 * s);
    ctx.quadraticCurveTo(tailSway, 38 * s, 9 * s, 14 * s);
    ctx.closePath();
    ctx.fill();

    // Legs (4 paws splayed, running animation)
    const legPhase = tick * 0.6;
    ctx.fillStyle = dino.body;
    if (pose !== 'slide') {
      const f = Math.sin(legPhase) * 4 * s;
      const b = Math.sin(legPhase + Math.PI) * 5 * s;
      ctx.beginPath();
      ctx.ellipse(-19 * s, -8 * s + f, 7 * s, 10 * s, 0.3, 0, Math.PI * 2);
      ctx.ellipse(19 * s, -8 * s - f, 7 * s, 10 * s, -0.3, 0, Math.PI * 2);
      ctx.ellipse(-20 * s, 14 * s + b, 7 * s, 11 * s, 0.3, 0, Math.PI * 2);
      ctx.ellipse(20 * s, 14 * s - b, 7 * s, 11 * s, -0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Body (oval seen from above)
    ctx.fillStyle = dino.body;
    ctx.beginPath();
    ctx.ellipse(0, 2 * s, 22 * s, 28 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Belly stripe
    ctx.fillStyle = dino.belly;
    ctx.beginPath();
    ctx.ellipse(0, 4 * s, 13 * s, 22 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Spikes along the back (centerline)
    ctx.fillStyle = dino.spike;
    for (let i = -2; i <= 1; i++) {
      const sy = i * 7 * s;
      ctx.beginPath();
      ctx.moveTo(-4 * s, sy);
      ctx.lineTo(0, sy - 6 * s);
      ctx.lineTo(4 * s, sy);
      ctx.closePath();
      ctx.fill();
    }

    // Head (above body, where dino is heading)
    ctx.fillStyle = dino.body;
    ctx.beginPath();
    ctx.ellipse(0, -24 * s, 16 * s, 15 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // Snout
    ctx.beginPath();
    ctx.ellipse(0, -34 * s, 11 * s, 9 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eyes (on the head, looking up)
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-6 * s, -26 * s, 4 * s, 0, Math.PI * 2);
    ctx.arc(6 * s, -26 * s, 4 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-6 * s, -27 * s, 2 * s, 0, Math.PI * 2);
    ctx.arc(6 * s, -27 * s, 2 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-5 * s, -28 * s, 0.9 * s, 0, Math.PI * 2);
    ctx.arc(7 * s, -28 * s, 0.9 * s, 0, Math.PI * 2);
    ctx.fill();

    // Nostrils
    ctx.fillStyle = dino.spike;
    ctx.beginPath();
    ctx.arc(-2.5 * s, -37 * s, 1.1 * s, 0, Math.PI * 2);
    ctx.arc(2.5 * s, -37 * s, 1.1 * s, 0, Math.PI * 2);
    ctx.fill();

    // Tiny teeth
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-5 * s, -32 * s);
    ctx.lineTo(-3 * s, -29 * s);
    ctx.lineTo(0, -32 * s);
    ctx.lineTo(3 * s, -29 * s);
    ctx.lineTo(5 * s, -32 * s);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawPlayer() {
    const px = game.laneAnim;
    const p = project(px, 0, 0.5);
    const pose = game.jumping || game.y > 0 ? 'jump' : (game.sliding > 0 ? 'slide' : 'run');
    const baseScale = Math.max(0.9, Math.min(1.6, H / 700));
    let scale = baseScale;
    if (pose === 'jump') scale = baseScale * (1 + Math.min(1, game.y) * 0.45);
    else if (pose === 'slide') scale = baseScale * 0.82;
    drawDinoTopDown(ctx, p.x, p.y, scale, game.dino, pose, game.tick * 2, Math.max(0, game.y));
  }

  function render() {
    drawSky();
    drawGround();

    // Collect all renderables, sort by z (far to near)
    const items = [];
    for (const d of game.decor) items.push({ z: d.z, draw: () => drawDecor(d) });
    for (const o of game.obstacles) items.push({ z: o.z, draw: () => drawObstacle(o) });
    for (const b of game.bones) items.push({ z: b.z, draw: () => drawBone(b) });
    items.sort((a, b) => b.z - a.z);
    for (const it of items) it.draw();

    // Player (always near)
    drawPlayer();

    if (game.hitFlash > 0) {
      ctx.fillStyle = `rgba(255,0,0,${game.hitFlash / 500})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ====== Loop ======
  let last = performance.now();
  function loop() {
    const now = performance.now();
    const dt = Math.min(50, now - last);
    last = now;
    if (game) {
      if (!game.over) update(dt);
      render();
    }
    requestAnimationFrame(loop);
  }
  loop();

  // ====== UI ======
  document.getElementById('btnPlay').addEventListener('click', () => {
    game = createGame();
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('hint').classList.remove('hidden');
    document.getElementById('touchZone').classList.remove('hidden');
  });
  document.getElementById('btnRestart').addEventListener('click', () => {
    game = createGame();
    document.getElementById('endScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('hint').classList.remove('hidden');
    document.getElementById('touchZone').classList.remove('hidden');
  });
})();
</script>
</body>
</html>
